<svg xmlns="http://www.w3.org/2000/svg" width="600" height="780" viewBox="0 0 600 780"><title>Hattusha evidence and time</title><style>text{font-family:Arial,sans-serif;font-size:30px;fill:#182d24}.title{font-size:35px;font-weight:700}.head{font-weight:700}.note{font-size:26px}</style><rect width="600" height="780" fill="#fffdf6"/><text x="30" y="42" class="title"><tspan x="30" dy="0">Hattusha</tspan><tspan x="30" dy="40">Keep the clocks apart</tspan></text><rect x="30" y="120" width="540" height="150" rx="10" fill="#edf2f0" stroke="#33483e" stroke-width="3" /><text x="50" y="164" class="head"><tspan x="50" dy="0">CAPITAL ORIENTATION</tspan><tspan x="50" dy="40">c. 1650–1180 BCE</tspan><tspan x="50" dy="40">Buildings have different phases.</tspan></text><rect x="30" y="290" width="540" height="155" rx="10" fill="#edf2f0" stroke="#33483e" stroke-width="3" /><text x="50" y="334" class="head"><tspan x="50" dy="0">GORDION TIMBERS</tspan><tspan x="50" dy="40">Drought: c. 1198–1196 BCE</tspan><tspan x="50" dy="40">Dating uncertainty: ±3 years.</tspan></text><rect x="30" y="485" width="540" height="155" rx="10" fill="#fff9ed" stroke="#33483e" stroke-width="3" stroke-dasharray="10 7"/><text x="50" y="529" class="head"><tspan x="50" dy="0">POLITICAL EXPLANATION</tspan><tspan x="50" dy="40">Which institutions withdrew?</tspan><tspan x="50" dy="40">Direct causation unproved.</tspan></text><text x="30" y="685" class="note"><tspan x="30" dy="0">The proxy is not a rainfall gauge</tspan><tspan x="30" dy="40">at the capital. No climate values</tspan><tspan x="30" dy="40">or automatic causal arrow drawn.</tspan></text></svg>