<svg xmlns="http://www.w3.org/2000/svg" width="600" height="300" viewBox="0 0 600 300"><title>Song crop loans: proposed timing</title><style>text{font-family:Arial,sans-serif;font-size:29px;fill:#182d24}.head{font-size:34px;font-weight:700}.small{font-size:24px}.label{font-weight:700}.stage{font-size:24px;font-weight:700}</style><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0L0,6L8,3Z" fill="#33483e"/></marker></defs><rect width="600" height="300" fill="#fffdf6"/><text x="30" y="45" class="head"><tspan x="30" dy="0">Song crop loans · 1069</tspan></text><rect x="30" y="75" width="250" height="130" rx="10" fill="#edf2f0" stroke="#33483e" stroke-width="3"/><rect x="320" y="75" width="250" height="130" rx="10" fill="#eadfb5" stroke="#33483e" stroke-width="3"/><text x="45" y="111" class="stage"><tspan x="45" dy="0">BEFORE HARVEST</tspan></text><text x="45" y="151" class="small"><tspan x="45" dy="0">Reserves supply</tspan><tspan x="45" dy="36">a household.</tspan></text><path d="M285,145L312,145" stroke="#33483e" stroke-width="4" marker-end="url(#arrow)"/><text x="335" y="111" class="stage"><tspan x="335" dy="0">AFTER HARVEST</tspan></text><text x="335" y="151" class="small"><tspan x="335" dy="0">Repay with tax</tspan><tspan x="335" dy="36">collection.</tspan></text><text x="30" y="250" class="small"><tspan x="30" dy="0">Test: choice, harvest and repayment.</tspan><tspan x="30" dy="36">Modern proposal guide; no outcome measured.</tspan></text></svg>