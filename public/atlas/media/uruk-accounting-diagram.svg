<svg xmlns="http://www.w3.org/2000/svg" width="600" height="780" viewBox="0 0 600 780"><title>An account selects information</title><style>text{font-family:Arial,sans-serif;font-size:30px;fill:#182d24}.title{font-size:35px;font-weight:700}.head{font-weight:700}.small{font-size:30px}.note{font-size:26px}</style><rect width="600" height="780" fill="#fffdf6"/><text x="30" y="52" class="title"><tspan x="30" dy="0">An account selects</tspan><tspan x="30" dy="40">information</tspan></text><rect x="30" y="125" width="540" height="120" rx="10" fill="#edf2f0" stroke="#33483e" stroke-width="3" /><text x="52" y="170" class="head"><tspan x="52" dy="0">1 · Category</tspan><tspan x="52" dy="40">What is being recorded?</tspan></text><text x="283" y="290" class="head"><tspan x="283" dy="0">+</tspan></text><rect x="30" y="315" width="540" height="120" rx="10" fill="#edf2f0" stroke="#33483e" stroke-width="3" /><text x="52" y="360" class="head"><tspan x="52" dy="0">2 · Quantity</tspan><tspan x="52" dy="40">How much is recorded?</tspan></text><rect x="30" y="470" width="540" height="120" rx="10" fill="#edf2f0" stroke="#33483e" stroke-width="3" /><text x="52" y="515" class="head"><tspan x="52" dy="0">3 · Durable record</tspan><tspan x="52" dy="40">Information survives the moment.</tspan></text><text x="30" y="635" class="head"><tspan x="30" dy="0">What might be left out?</tspan><tspan x="30" dy="40">People, preparation, decisions.</tspan></text><text x="30" y="720" class="note"><tspan x="30" dy="0">Concept guide, not a translation.</tspan><tspan x="30" dy="40">See the actual tablet for its marks.</tspan></text></svg>