<svg xmlns="http://www.w3.org/2000/svg" width="600" height="780" viewBox="0 0 600 780"><title>Dholavira water components</title><style>text{font-family:Arial,sans-serif;font-size:30px;fill:#182d24}.title{font-size:35px;font-weight:700}.head{font-weight:700}.small{font-size:30px}.note{font-size:26px}</style><rect width="600" height="780" fill="#fffdf6"/><text x="30" y="42" class="title"><tspan x="30" dy="0">Dholavira</tspan><tspan x="30" dy="40">Water and urban space</tspan></text><text x="30" y="125" class="note"><tspan x="30" dy="0">North ↑     East →</tspan><tspan x="30" dy="40">Schematic: no scale or flow arrows.</tspan></text><rect x="30" y="200" width="270" height="165" rx="10" fill="#edf2f0" stroke="#33483e" stroke-width="3" /><text x="48" y="245" class="small"><tspan x="48" dy="0">CASTLE</tspan><tspan x="48" dy="40">Well · C6</tspan><tspan x="48" dy="40">Drain · C7</tspan></text><rect x="330" y="200" width="240" height="165" rx="10" fill="#edf2f0" stroke="#33483e" stroke-width="3" /><text x="350" y="245" class="head"><tspan x="350" dy="0">EAST</tspan><tspan x="350" dy="40">RESERVOIR</tspan></text><rect x="30" y="405" width="540" height="85" rx="10" fill="#edf2f0" stroke="#33483e" stroke-width="3" /><text x="50" y="455" class="head"><tspan x="50" dy="0">SOUTH RESERVOIRS</tspan></text><rect x="30" y="530" width="540" height="135" rx="10" fill="#fff9ed" stroke="#33483e" stroke-width="3" stroke-dasharray="10 7"/><text x="50" y="568" class="small"><tspan x="50" dy="0">East of the East Reservoir:</tspan><tspan x="50" dy="40">GPR research area</tspan><tspan x="50" dy="40">Unconfirmed water structures.</tspan></text><text x="30" y="710" class="note"><tspan x="30" dy="0">Solid: recorded components.</tspan><tspan x="30" dy="40">Dashed: proposals need excavation.</tspan></text></svg>