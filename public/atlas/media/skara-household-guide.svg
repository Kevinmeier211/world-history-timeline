<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400" role="img"><title>House 1: features, not a measured plan</title><desc>Independent modern relationship guide from textual information, not a traced source plan. Central hearth, shelving beyond, entrance, and four side slab enclosures shown as two on each side. A separate, fifth enclosure left of the entrance is wider. Nineteenth-century rebuilding omitted recorded cells. Box sizes and dashed links are symbolic; no dimensions, orientation, roof or gendered occupants are reconstructed.</desc><style>text{font-family:Arial,sans-serif;font-size:32px;fill:#182d24}.head{font-size:32px;font-weight:700}.shape{fill:none;stroke:#33483e;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.stone{fill:#d5c796;stroke:#33483e;stroke-width:2}</style><rect width="600" height="400" fill="#fffdf6"/><text x="18" y="39" class="head"><tspan x="18" dy="0">House 1: features, not a plan</tspan></text>
