<svg xmlns="http://www.w3.org/2000/svg" width="600" height="780" viewBox="0 0 600 780"><title>Uluburun evidence categories</title><style>text{font-family:Arial,sans-serif;font-size:30px;fill:#182d24}.title{font-size:35px;font-weight:700}.head{font-weight:700}.note{font-size:26px}</style><rect width="600" height="780" fill="#fffdf6"/><text x="30" y="42" class="title"><tspan x="30" dy="0">Uluburun</tspan><tspan x="30" dy="40">Different levels of evidence</tspan></text><rect x="30" y="120" width="540" height="110" rx="10" fill="#edf2f0" stroke="#33483e" stroke-width="3" /><text x="50" y="164" class="head"><tspan x="50" dy="0">FINDSPOT: OFF KAŞ</tspan><tspan x="50" dy="40">Wreck c. 1320 BCE ±15 years.</tspan></text><rect x="30" y="265" width="540" height="110" rx="10" fill="#edf2f0" stroke="#33483e" stroke-width="3" /><text x="50" y="309" class="head"><tspan x="50" dy="0">RECOVERED ASSOCIATION</tspan><tspan x="50" dy="40">Copper · tin · containers · hull.</tspan></text><rect x="30" y="410" width="540" height="155" rx="10" fill="#fff9ed" stroke="#33483e" stroke-width="3" stroke-dasharray="10 7"/><text x="50" y="454" class="head"><tspan x="50" dy="0">ORIGINS INFERRED</tspan><tspan x="50" dy="40">Samples and comparisons.</tspan><tspan x="50" dy="40">Tin sources remain contested.</tspan></text><rect x="30" y="575" width="540" height="110" rx="10" fill="#edf2f0" stroke="#33483e" stroke-width="3" /><text x="50" y="619" class="head"><tspan x="50" dy="0">STILL UNRESOLVED</tspan><tspan x="50" dy="40">Itinerary · ownership · crew.</tspan></text><text x="30" y="735" class="note"><tspan x="30" dy="0">Evidence guide, not a sailing route.</tspan></text></svg>