<svg xmlns="http://www.w3.org/2000/svg" width="600" height="360" viewBox="0 0 600 360" role="img"><title>Small marks make a pattern</title><desc>Original modern action guide. A hypothetical tool has three rectangular teeth. One downward press leaves three short marks in a generic band; repeating the action produces three groups of three marks. This is not a copied Lapita motif, the pattern of a photographed cast, an archaeologically recovered tool or an ancient vessel reconstruction. Tool, band and marks are illustrative rather than measured.</desc><style>text{font-family:Arial,sans-serif;font-size:32px;fill:#182d24}.head{font-weight:700}.shape{fill:none;stroke:#33483e;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.mark{fill:#33483e}</style><rect width="600" height="360" fill="#fffdf6"/><text x="18" y="41" class="head"><tspan x="18" dy="0">Small marks make a pattern</tspan></text>
<rect x="18" y="78" width="170" height="178" rx="9" fill="#edf2f0" stroke="#33483e" stroke-width="3"/><rect x="215" y="78" width="170" height="178" rx="9" fill="#eadfb5" stroke="#33483e" stroke-width="3"/><rect x="412" y="78" width="170" height="178" rx="9" fill="#edf2f0" stroke="#33483e" stroke-width="3"/>
<text x="103" y="119" text-anchor="middle"><tspan x="103" dy="0">Tool</tspan></text>
<text x="300" y="119" text-anchor="middle"><tspan x="300" dy="0">Press</tspan></text>
<text x="497" y="119" text-anchor="middle"><tspan x="497" dy="0">Repeat</tspan></text>
