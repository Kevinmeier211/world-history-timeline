<svg xmlns="http://www.w3.org/2000/svg" width="600" height="360" viewBox="0 0 600 360" role="img"><title>A surface takes skilled work</title><desc>Original modern action guide to the museum account of Kerma pottery. Generic vessel symbols represent shaping by hand, surface coating and polishing, and controlled firing. No excavated kiln, measured ancient vessel profile, firing temperature, workshop location or precise sequence of atmosphere changes is reconstructed. The drawing uses teaching colors rather than a material analysis.</desc><style>text{font-family:Arial,sans-serif;font-size:32px;fill:#182d24}.head{font-weight:700}.shape{fill:none;stroke:#33483e;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}</style><rect width="600" height="360" fill="#fffdf6"/><text x="18" y="41" class="head"><tspan x="18" dy="0">A surface takes skilled work</tspan></text><rect x="18" y="78" width="170" height="178" rx="9" fill="#edf2f0" stroke="#33483e" stroke-width="3"/><rect x="215" y="78" width="170" height="178" rx="9" fill="#eadfb5" stroke="#33483e" stroke-width="3"/><rect x="412" y="78" width="170" height="178" rx="9" fill="#edf2f0" stroke="#33483e" stroke-width="3"/><text x="103" y="120" text-anchor="middle"><tspan x="103" dy="0">Shape</tspan></text><text x="300" y="120" text-anchor="middle"><tspan x="300" dy="0">Polish</tspan></text><text x="497" y="120" text-anchor="middle"><tspan x="497" dy="0">Fire</tspan></text><path d="M194,190H209m-7,-6l7,6l-7,6" class="shape"/><path d="M391,190H406m-7,-6l7,6l-7,6" class="shape"/><path class="shape" d="M55,165Q62,229 103,232Q144,229 151,165M55,165Q103,179 151,165M55,165Q103,151 151,165"/><path class="shape" d="M252,180Q258,232 300,234Q342,232 348,180M252,180Q300,192 348,180M267,169L311,154"/><path d="M293,156L323,146L331,160L302,170Z" fill="#d5c796" stroke="#33483e" stroke-width="3"/><path d="M449,165Q456,232 497,234Q538,232 545,165Z" fill="#d5c796" stroke="#33483e" stroke-width="3"/><path d="M449,165Q497,151 545,165L540,187Q497,199 454,187Z" fill="#33483e"/><path class="shape" d="M460,145q-7,-9 0,-17m33,17q-7,-9 0,-17m33,17q-7,-9 0,-17"/><text x="18" y="302"><tspan x="18" dy="0">Modern guide to making.</tspan></text><text x="18" y="343"><tspan x="18" dy="0">No excavated kiln is shown.</tspan></text></svg>