<svg xmlns="http://www.w3.org/2000/svg" width="600" height="650" viewBox="0 0 600 650"><title>Inca work: household, obligation and provisioning</title><style>text{font-family:Arial,sans-serif;font-size:29px;fill:#182d24}.head{font-size:34px;font-weight:700}.small{font-size:24px}.label{font-weight:700}.stage{font-size:24px;font-weight:700}</style><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0L0,6L8,3Z" fill="#33483e"/></marker></defs><rect width="600" height="650" fill="#fffdf6"/><text x="30" y="45" class="head"><tspan x="30" dy="0">Inca work</tspan><tspan x="30" dy="36">Tasks and obligations</tspan></text><rect x="30" y="120" width="540" height="120" rx="10" fill="#edf2f0" stroke="#33483e" stroke-width="3"/><text x="50" y="158" class="label"><tspan x="50" dy="0">HOUSEHOLD / SPECIALIST WORK</tspan></text><text x="50" y="204" class="small"><tspan x="50" dy="0">Care, food, fiber and skilled making</tspan></text><path d="M300,247L300,274" stroke="#33483e" stroke-width="4" marker-end="url(#arrow)"/><rect x="30" y="290" width="540" height="120" rx="10" fill="#eadfb5" stroke="#33483e" stroke-width="3"/><text x="50" y="328" class="label"><tspan x="50" dy="0">STATE DEMANDS</tspan></text><text x="50" y="374" class="small"><tspan x="50" dy="0">Service, construction and supplies</tspan></text><path d="M300,417L300,444" stroke="#33483e" stroke-width="4" marker-end="url(#arrow)"/><rect x="30" y="460" width="540" height="120" rx="10" fill="#edf2f0" stroke="#33483e" stroke-width="3"/><text x="50" y="498" class="label"><tspan x="50" dy="0">STORES / PROVISIONING</tspan></text><text x="50" y="537" class="small"><tspan x="50" dy="0">Collect, keep and distribute resources</tspan></text><text x="30" y="608" class="small"><tspan x="30" dy="0">Modern guide. Arrows imply no equal return.</tspan></text></svg>