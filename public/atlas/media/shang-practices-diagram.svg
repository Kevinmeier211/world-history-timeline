<svg xmlns="http://www.w3.org/2000/svg" width="600" height="780" viewBox="0 0 600 780"><title>Shang making and recording</title><style>text{font-family:Arial,sans-serif;font-size:30px;fill:#182d24}.title{font-size:35px;font-weight:700}.head{font-weight:700}.note{font-size:26px}</style><rect width="600" height="780" fill="#fffdf6"/><text x="30" y="42" class="title"><tspan x="30" dy="0">Shang</tspan><tspan x="30" dy="40">Making and recording</tspan></text><rect x="30" y="120" width="540" height="200" rx="10" fill="#edf2f0" stroke="#33483e" stroke-width="3" /><text x="50" y="164" class="head"><tspan x="50" dy="0">MAKING A HOLLOW VESSEL</tspan><tspan x="50" dy="40">Model → clay mold sections</tspan><tspan x="50" dy="40">Reassemble with an inner core.</tspan><tspan x="50" dy="40">A cavity remains in the casting.</tspan></text><rect x="30" y="365" width="540" height="200" rx="10" fill="#edf2f0" stroke="#33483e" stroke-width="3" /><text x="50" y="409" class="head"><tspan x="50" dy="0">RECORDING DIVINATION</tspan><tspan x="50" dy="40">Topic or charge</tspan><tspan x="50" dy="40">Crack interpretation</tspan><tspan x="50" dy="40">A possible recorded outcome</tspan></text><text x="30" y="635" class="note"><tspan x="30" dy="0">Different activities, different evidence.</tspan><tspan x="30" dy="40">No ancient signs or translation</tspan><tspan x="30" dy="40">of the selected bone are supplied.</tspan></text><text x="30" y="755" class="note"><tspan x="30" dy="0">Modern guide; not a workshop plan.</tspan></text></svg>