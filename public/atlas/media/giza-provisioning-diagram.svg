<svg xmlns="http://www.w3.org/2000/svg" width="600" height="300" viewBox="0 0 600 300" role="img"><title>Food involved several kinds of work</title><desc>Original modern functional guide. Grain storage connects to preparation and baking, then meals and work. Generic symbols show no quantities, measured flow, recipe or surveyed plan.</desc><style>text{font-family:Arial,sans-serif;font-size:24px;fill:#182d24}.head{font-size:32px;font-weight:700}.shape{fill:none;stroke:#33483e;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.stone{fill:#d5c796;stroke:#33483e;stroke-width:2}</style><rect width="600" height="300" fill="#fffdf6"/><text x="18" y="39" class="head"><tspan x="18" dy="0">Food involved several kinds of work</tspan></text>
