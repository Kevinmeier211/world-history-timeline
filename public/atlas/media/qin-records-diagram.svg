<svg xmlns="http://www.w3.org/2000/svg" width="600" height="780" viewBox="0 0 600 780"><title>Qin devices, records and practice</title><style>text{font-family:Arial,sans-serif;font-size:30px;fill:#182d24}.title{font-size:35px;font-weight:700}.head{font-weight:700}.note{font-size:26px}</style><rect width="600" height="780" fill="#fffdf6"/><text x="30" y="42" class="title"><tspan x="30" dy="0">Qin</tspan><tspan x="30" dy="40">Devices, records and practice</tspan></text><rect x="30" y="120" width="540" height="155" rx="10" fill="#edf2f0" stroke="#33483e" stroke-width="3"/><text x="50" y="164" class="head"><tspan x="50" dy="0">INSCRIBED DEVICES</tspan><tspan x="50" dy="40">Balance weight: mass.</tspan><tspan x="50" dy="40">Capacity measure: volume.</tspan></text><rect x="30" y="310" width="540" height="155" rx="10" fill="#edf2f0" stroke="#33483e" stroke-width="3"/><text x="50" y="354" class="head"><tspan x="50" dy="0">ADMINISTRATIVE RECORDS</tspan><tspan x="50" dy="40">Grain and responsibility.</tspan><tspan x="50" dy="40">Required facts; varied layout.</tspan></text><rect x="30" y="500" width="540" height="155" rx="10" fill="#edf2f0" stroke="#33483e" stroke-width="3"/><text x="50" y="544" class="head"><tspan x="50" dy="0">TEST LOCAL PRACTICE</tspan><tspan x="50" dy="40">Compare material and format.</tspan><tspan x="50" dy="40">Separate rule from outcome.</tspan></text><text x="30" y="685" class="note"><tspan x="30" dy="0">Modern guide, not a tablet facsimile.</tspan><tspan x="30" dy="40">No ancient signs or quantities</tspan><tspan x="30" dy="40">are invented.</tspan></text></svg>