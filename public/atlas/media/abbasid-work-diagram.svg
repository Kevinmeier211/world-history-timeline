<svg xmlns="http://www.w3.org/2000/svg" width="600" height="780" viewBox="0 0 600 780"><title>Lustre pottery: body, surface and controlled firing</title><style>text{font-family:Arial,sans-serif;font-size:29px;fill:#182d24}.head{font-size:34px;font-weight:700}.small{font-size:25px}.label{font-weight:700}</style><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0L0,6L8,3Z" fill="#33483e"/></marker></defs><rect width="600" height="780" fill="#fffdf6"/><text x="30" y="45" class="head"><tspan x="30" dy="0">Lustre pottery</tspan><tspan x="30" dy="36">Work behind a surface</tspan></text><rect x="30" y="120" width="540" height="155" rx="10" fill="#edf2f0" stroke="#33483e" stroke-width="3"/><path d="M55,175Q110,265 165,175" fill="none" stroke="#a46a42" stroke-width="14"/><text x="195" y="160" class="label"><tspan x="195" dy="0">1. BODY</tspan></text><text x="195" y="203" class="small"><tspan x="195" dy="0">Prepare and form</tspan><tspan x="195" dy="36">the earthenware.</tspan></text><path d="M300,280L300,308" stroke="#33483e" stroke-width="4" marker-end="url(#arrow)"/><rect x="30" y="325" width="540" height="155" rx="10" fill="#edf2f0" stroke="#33483e" stroke-width="3"/><path d="M55,380Q110,470 165,380" fill="none" stroke="#a46a42" stroke-width="14"/><path d="M55,375Q110,465 165,375" fill="none" stroke="#ffffff" stroke-width="8"/><text x="195" y="365" class="label"><tspan x="195" dy="0">2. SURFACE</tspan></text><text x="195" y="408" class="small"><tspan x="195" dy="0">Opaque glaze</tspan><tspan x="195" dy="36">and firing.</tspan></text><path d="M300,485L300,513" stroke="#33483e" stroke-width="4" marker-end="url(#arrow)"/><rect x="30" y="530" width="540" height="155" rx="10" fill="#edf2f0" stroke="#33483e" stroke-width="3"/><path d="M55,585Q110,675 165,585" fill="none" stroke="#a46a42" stroke-width="14"/><path d="M55,580Q110,670 165,580" fill="none" stroke="#ffffff" stroke-width="8"/><path d="M58,581Q110,658 162,581" fill="none" stroke="#9c7c31" stroke-width="4"/><text x="195" y="570" class="label"><tspan x="195" dy="0">3. LUSTRE</tspan></text><text x="195" y="613" class="small"><tspan x="195" dy="0">Decorate; control</tspan><tspan x="195" dy="36">the firing atmosphere.</tspan></text><text x="30" y="725" class="small"><tspan x="30" dy="0">Skill, kiln, fuel and failures.</tspan><tspan x="30" dy="36">Simplified tasks; not a tested recipe.</tspan></text></svg>