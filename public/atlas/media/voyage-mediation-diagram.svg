<svg xmlns="http://www.w3.org/2000/svg" width="600" height="300" viewBox="0 0 600 300"><title>An arrival requires more than sailing</title><style>text{font-family:Arial,sans-serif;font-size:24px;fill:#182d24}.head{font-size:30px;font-weight:700}.label{font-weight:700}</style><rect width="600" height="300" fill="#fffdf6"/><rect x="25" y="75" width="255" height="125" rx="10" fill="#edf2f0" stroke="#33483e" stroke-width="3"/><rect x="320" y="75" width="255" height="125" rx="10" fill="#eadfb5" stroke="#33483e" stroke-width="3"/><text x="25" y="43" class="head"><tspan x="25" dy="0">An arrival requires local knowledge</tspan></text><text x="40" y="109" class="label"><tspan x="40" dy="0">MALINDI</tspan></text><text x="40" y="147" class=""><tspan x="40" dy="0">Supplies</tspan><tspan x="40" dy="34">and a pilot</tspan></text><path d="M286,138L312,138L304,132M312,138L304,144" fill="none" stroke="#33483e" stroke-width="4"/><text x="335" y="109" class="label"><tspan x="335" dy="0">CALICUT</tspan></text><text x="335" y="147" class=""><tspan x="335" dy="0">Interpreters and</tspan><tspan x="335" dy="34">a court audience</tspan></text><text x="25" y="244" class=""><tspan x="25" dy="0">Narrative sequence, not an exact ship track.</tspan><tspan x="25" dy="34">Assistance does not establish free choice.</tspan></text></svg>