<svg xmlns="http://www.w3.org/2000/svg" width="600" height="360" viewBox="0 0 600 360" role="img"><title>Dates change the question</title><desc>Original modern relationship guide to a change in archaeological interpretation. A generic surface mound symbol leads to a generic layered sample and then to notes about local history. The shapes, layers, spacing and number of marks are illustrative, not an observed San Lorenzo mound, measured cross-section, house plan, survey or census. No source figure is copied.</desc><style>text{font-family:Arial,sans-serif;font-size:32px;fill:#182d24}.head{font-weight:700}.shape{fill:none;stroke:#33483e;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.mark{fill:#33483e}</style><rect width="600" height="360" fill="#fffdf6"/><text x="18" y="41" class="head"><tspan x="18" dy="0">Dates change the question</tspan></text>
