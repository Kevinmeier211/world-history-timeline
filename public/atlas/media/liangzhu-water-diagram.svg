<svg xmlns="http://www.w3.org/2000/svg" width="600" height="780" viewBox="0 0 600 780"><title>Liangzhu materials water production</title><style>text{font-family:Arial,sans-serif;font-size:30px;fill:#182d24}.title{font-size:35px;font-weight:700}.head{font-weight:700}.small{font-size:30px}.note{font-size:26px}</style><rect width="600" height="780" fill="#fffdf6"/><text x="30" y="42" class="title"><tspan x="30" dy="0">Liangzhu</tspan><tspan x="30" dy="40">Work across a landscape</tspan></text><rect x="30" y="120" width="540" height="115" rx="10" fill="#edf2f0" stroke="#33483e" stroke-width="3" /><text x="52" y="164" class="head"><tspan x="52" dy="0">BUILD</tspan><tspan x="52" dy="40">Grass-wrapped clay in dams.</tspan></text><rect x="30" y="270" width="540" height="115" rx="10" fill="#edf2f0" stroke="#33483e" stroke-width="3" /><text x="52" y="314" class="head"><tspan x="52" dy="0">MANAGE WATER</tspan><tspan x="52" dy="40">Storage · dams · channels.</tspan></text><rect x="30" y="420" width="540" height="145" rx="10" fill="#edf2f0" stroke="#33483e" stroke-width="3" /><text x="52" y="464" class="head"><tspan x="52" dy="0">PRODUCE AND MOVE</tspan><tspan x="52" dy="40">Rice cultivation; movement of</tspan><tspan x="52" dy="40">people and materials.</tspan></text><text x="30" y="622" class="note"><tspan x="30" dy="0">Who carried the materials?</tspan><tspan x="30" dy="40">Who decided how to share benefits?</tspan></text><text x="30" y="710" class="note"><tspan x="30" dy="0">Conceptual relationships, not a canal</tspan><tspan x="30" dy="40">map or a reconstructed workday.</tspan></text></svg>