<svg xmlns="http://www.w3.org/2000/svg" width="600" height="360" viewBox="0 0 600 360" role="img"><title>Different records, different tests</title><desc>Original modern comparison guide: a generic royal record supports interpreting a claim, a generic instruction supports interpreting an order, and a question mark asks what would establish an outcome. The icons are not an ancient inscription, tablet, plan, receipt or translation. Arrows connect questions in a modern investigation, not historical institutions, travel or transmission.</desc><style>text{font-family:Arial,sans-serif;font-size:32px;fill:#182d24}.head{font-weight:700}.shape{fill:none;stroke:#33483e;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}</style><rect width="600" height="360" fill="#fffdf6"/><text x="18" y="41" class="head"><tspan x="18" dy="0">Different records, different tests</tspan></text><rect x="18" y="78" width="170" height="178" rx="9" fill="#edf2f0" stroke="#33483e" stroke-width="3"/><rect x="215" y="78" width="170" height="178" rx="9" fill="#eadfb5" stroke="#33483e" stroke-width="3"/><rect x="412" y="78" width="170" height="178" rx="9" fill="#edf2f0" stroke="#33483e" stroke-width="3"/><text x="103" y="120" text-anchor="middle"><tspan x="103" dy="0">Claim</tspan></text><text x="300" y="120" text-anchor="middle"><tspan x="300" dy="0">Order</tspan></text><text x="497" y="120" text-anchor="middle"><tspan x="497" dy="0">Outcome?</tspan></text><path d="M194,190H209m-7,-6l7,6l-7,6" class="shape"/><path d="M391,190H406m-7,-6l7,6l-7,6" class="shape"/><rect x="65" y="153" width="76" height="80" rx="5" fill="#fffdf6" stroke="#33483e" stroke-width="3"/><path class="shape" d="M80,173H125M80,191H125M80,209H114"/><rect x="258" y="153" width="84" height="80" rx="5" fill="#fffdf6" stroke="#33483e" stroke-width="3"/><path class="shape" d="M272,173H328M272,191H320M272,209H310"/><path class="shape" d="M272,222H310"/><text x="497" y="221" text-anchor="middle" class="head"><tspan x="497" dy="0">?</tspan></text><text x="18" y="302"><tspan x="18" dy="0">An order is not a receipt.</tspan></text><text x="18" y="343"><tspan x="18" dy="0">Modern guide, not a record.</tspan></text></svg>