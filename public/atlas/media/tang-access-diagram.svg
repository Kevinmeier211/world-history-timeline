<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400"><title>Chang’an: an errand through a ward gate</title><style>text{font-family:Arial,sans-serif;font-size:29px;fill:#182d24}.head{font-size:34px;font-weight:700}.small{font-size:25px}.label{font-weight:700}</style><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0L0,6L8,3Z" fill="#33483e"/></marker></defs><rect width="600" height="400" fill="#fffdf6"/><text x="25" y="40" class="head"><tspan x="25" dy="0">Chang’an</tspan><tspan x="25" dy="36">Access through a gate</tspan></text><rect x="25" y="115" width="210" height="145" rx="8" fill="#edf2f0" stroke="#33483e" stroke-width="4"/><text x="43" y="155" class="label"><tspan x="43" dy="0">WARD</tspan></text><text x="43" y="191" class="small"><tspan x="43" dy="0">Homes /</tspan><tspan x="43" dy="36">institutions</tspan></text><rect x="227" y="185" width="16" height="42" fill="#fffdf6"/><path d="M232,185L250,197M232,227L250,215" stroke="#33483e" stroke-width="3"/><rect x="280" y="165" width="115" height="80" rx="6" fill="#dde5e9"/><text x="287" y="194" class="small"><tspan x="287" dy="0">PUBLIC</tspan><tspan x="287" dy="36">STREET</tspan></text><path d="M180,206L272,206M397,206L425,206" fill="none" stroke="#33483e" stroke-width="4" marker-end="url(#arrow)"/><rect x="430" y="115" width="145" height="145" rx="8" fill="#eadfb5" stroke="#33483e" stroke-width="3"/><text x="440" y="155" class="label"><tspan x="440" dy="0">MARKET</tspan></text><text x="182" y="288" class="small"><tspan x="182" dy="0">GATE</tspan></text><text x="285" y="288" class="small"><tspan x="285" dy="0">Daytime errand</tspan></text><text x="25" y="345" class="small"><tspan x="25" dy="0">Functional settings; no scale or exact route.</tspan><tspan x="25" dy="36">Modern guide. Rules need evidence of practice.</tspan></text></svg>