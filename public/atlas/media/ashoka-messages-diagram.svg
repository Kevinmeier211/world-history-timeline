<svg xmlns="http://www.w3.org/2000/svg" width="600" height="780" viewBox="0 0 600 780"><title>Ashoka regional messages</title><style>text{font-family:Arial,sans-serif;font-size:30px;fill:#182d24}.title{font-size:35px;font-weight:700}.head{font-weight:700}.note{font-size:26px}</style><rect width="600" height="780" fill="#fffdf6"/><text x="30" y="42" class="title"><tspan x="30" dy="0">Ashoka</tspan><tspan x="30" dy="40">Place, audience and action</tspan></text><rect x="30" y="120" width="540" height="155" rx="10" fill="#edf2f0" stroke="#33483e" stroke-width="3"/><text x="50" y="164" class="head"><tspan x="50" dy="0">GIRNAR: ROCK EDICT II</tspan><tspan x="50" dy="40">Provision, planting and wells.</tspan><tspan x="50" dy="40">People and cattle.</tspan></text><rect x="30" y="310" width="540" height="155" rx="10" fill="#edf2f0" stroke="#33483e" stroke-width="3"/><text x="50" y="354" class="head"><tspan x="50" dy="0">DHAULI: SEPARATE EDICT I</tspan><tspan x="50" dy="40">Judicial officials addressed.</tspan><tspan x="50" dy="40">Impartiality is commanded.</tspan></text><rect x="30" y="500" width="540" height="155" rx="10" fill="#edf2f0" stroke="#33483e" stroke-width="3"/><text x="50" y="544" class="head"><tspan x="50" dy="0">KANDAHAR: LANGUAGES</tspan><tspan x="50" dy="40">Greek and Aramaic material.</tspan><tspan x="50" dy="40">Regional communication.</tspan></text><text x="30" y="685" class="note"><tspan x="30" dy="0">Selected records, not one text.</tspan><tspan x="30" dy="40">Royal announcements need</tspan><tspan x="30" dy="40">evidence of their effects.</tspan></text></svg>