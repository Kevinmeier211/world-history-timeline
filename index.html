<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preload" href="/atlas/index.json" as="fetch" crossorigin="anonymous" />
    <link
      rel="preload"
      href="/node_modules/@fontsource/source-sans-3/files/source-sans-3-latin-400-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/node_modules/@fontsource/source-sans-3/files/source-sans-3-vietnamese-400-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/node_modules/@fontsource/source-serif-4/files/source-serif-4-latin-400-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/node_modules/@fontsource/source-serif-4/files/source-serif-4-vietnamese-600-normal.woff2"
      as="font"
      type="font/woff2"
      fetchpriority="low"
      crossorigin
    />
    <!-- MANDATORY: Declare support for both light and dark themes -->
    <meta name="color-scheme" content="light dark" />
    <script>
      try {
        document.querySelector('meta[name="color-scheme"]').content =
          localStorage.getItem('color-scheme') ?? 'light dark';
      } catch (e) {}
    </script>
    <title>Chronos Atlas — States and peoples, 3300 BCE to 2000 CE</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
